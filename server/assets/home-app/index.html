<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Glasshouse Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#ece7df;overflow:hidden;font-family:sans-serif;cursor:none}
#status{position:absolute;left:8vw;bottom:10vh;font-size:2.4vh;color:#6b665e;opacity:0;-webkit-transition:opacity .6s;transition:opacity .6s}
#status.on{opacity:1}
</style>
</head>
<body>
<div id="status">Glasshouse Home is starting. Press OK for LG's Home.</div>
<script>
/*
 * Glasshouse Home's app, which the TV opens as its Home. The view itself is
 * served by the Glasshouse server on this TV; this page opens it once the
 * server answers. After a cold start the TV opens this app about 15 s in and
 * the server answers some 30 s later (a G3, webOS 9.2), so the page waits on
 * black rather than showing LG's Home in between. OK opens LG's Home at once,
 * as does no answer within GIVE_UP_MS, so a server that never starts cannot
 * leave the TV on a black screen. Holding Home needs the server, so it does
 * not work here. Asking goes on: the server, once started, brings Glasshouse
 * Home back.
 */
(function () {
  var GIVE_UP_MS = 90000;
  var started = Date.now();
  var done = false;

  // Launched with { wall } or { hour }, the view shows that wallpaper slot,
  // to check each one on the panel.
  function preview() {
    var p = {};
    try { p = JSON.parse(window.PalmSystem.launchParams || '{}') || {}; } catch (e) {}
    var out = '';
    if (/^[a-z]+$/.test(String(p.wall || ''))) out += '&wall=' + p.wall;
    if (/^\d{1,2}$/.test(String(p.hour || ''))) out += '&hour=' + p.hour;
    return out;
  }

  function openView() {
    if (done) return;
    done = true;
    location.replace('http://localhost:8080/assets/home.html?t=' + Date.now() + preview());
  }

  var askedLg = false;
  function lgHome() {
    if (askedLg) return;
    askedLg = true;
    document.getElementById('status').textContent = 'Glasshouse is not answering yet. Opening LG\'s Home.';
    try {
      var bridge = new window.PalmServiceBridge();
      bridge.call('luna://com.webos.applicationManager/launch', JSON.stringify({ id: 'com.webos.app.home' }));
    } catch (e) {}
  }

  function retry() {
    if (Date.now() - started >= GIVE_UP_MS) lgHome();
    setTimeout(probe, askedLg ? 2000 : 600);
  }

  function probe() {
    if (done) return;
    var x = new XMLHttpRequest();
    x.open('GET', 'http://localhost:8080/api/caps?t=' + Date.now(), true);
    x.timeout = 1500;
    x.onload = function () { if (x.status >= 200 && x.status < 400) openView(); else retry(); };
    x.onerror = x.ontimeout = retry;
    x.send();
  }

  document.addEventListener('keydown', function (e) {
    if (e.keyCode !== 13 || done) return;
    e.preventDefault();
    // Asked again on every press: LG's Home may not open this early after a cold start.
    askedLg = false;
    lgHome();
  }, true);
  setTimeout(function () { if (!done) document.getElementById('status').className = 'on'; }, 1500);
  probe();
})();
</script>
</body>
</html>
